# Боевой сервер на своём VPS (например, Timeweb Cloud, Selectel, Yandex Cloud).
# Caddy сам получает HTTPS-сертификат Let's Encrypt для вашего домена.
# Запуск: см. deploy/README.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend/planner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Укажите JWT_SECRET в deploy/.env}
      DATABASE_URL: postgresql://planner:${POSTGRES_PASSWORD}@db:5432/planner?schema=public
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # Ежедневная резервная копия базы в папку deploy/backups (хранится 14 дней).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U planner planner | gzip > /backups/planner-$$(date +%Y%m%d-%H%M).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
