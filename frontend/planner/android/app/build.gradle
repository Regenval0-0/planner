apply plugin: 'com.android.application'

// Читаем version из package.json для синхронизации с frontend
import groovy.json.JsonSlurper

def packageJson = new JsonSlurper().parse(file('../../package.json'))
def versionParts = packageJson.version.tokenize('.')
def versionMajor = versionParts[0].toInteger()
def versionMinor = versionParts[1].toInteger()
def versionPatch = versionParts[2].toInteger()
def appVersionCode = (versionMajor * 10000) + (versionMinor * 100) + versionPatch

def appVersionName = packageJson.version

android {
    namespace = "com.planner.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.planner.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Подпись релиза. Приоритет: keystore.properties (создаётся scripts/create-keystore.bat
    // или в GitHub Actions из секретов) → старые файлы ключа с паролем planner123.
    def keystoreProps = file('keystore.properties')
    def legacyKeystore = file('planner-release.keystore').exists() ? file('planner-release.keystore') : file('planner.keystore')
    def hasSigning = keystoreProps.exists() || legacyKeystore.exists()

    signingConfigs {
        release {
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                storeFile file(props['STORE_FILE'])
                storePassword props['STORE_PASSWORD']
                keyAlias props['KEY_ALIAS']
                keyPassword props['KEY_PASSWORD']
            } else if (legacyKeystore.exists()) {
                storeFile legacyKeystore
                storePassword 'planner123'
                keyAlias 'planner'
                keyPassword 'planner123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
