appId: com.planner.desktop
productName: Планер
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - public/**/*
  - package.json
extraResources:
  - from: ../../backend/planner/dist
    to: backend/planner/dist
  - from: ../../backend/planner/prisma
    to: backend/planner/prisma
  - from: ../../backend/planner/package.json
    to: backend/planner/package.json
  - from: ../../backend/planner/node_modules
    to: backend/planner/node_modules
win:
  target:
    - target: portable
      arch: x64
    - target: nsis
      arch: x64
  signAndEditExecutable: false
portable:
  artifactName: ${productName}-Portable-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.exe
  shortcutName: "Планер"
  createDesktopShortcut: always
  createStartMenuShortcut: true
