appId: ru.planner.desktop
productName: Планер
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!**/*.map"
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # Подписи кода нет, но иконка и сведения о программе в .exe записываются.
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Планер
  artifactName: Planer-Setup-${version}.exe
  deleteAppDataOnUninstall: false
portable:
  artifactName: Planer-Portable-${version}.exe
publish: null
