services:
  - type: web
    name: planner-backend
    env: node
    buildCommand: cd backend/planner && npm install && npm run db:generate && npm run db:migrate && npm run build
    startCommand: cd backend/planner && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: planner-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    healthCheckPath: /health

databases:
  - name: planner-db
    plan: free
    ipAllowList: []
