services:
  - type: web
    name: planner-backend
    runtime: node
    repo: https://github.com/Regenval0-0/planner
    buildCommand: cd backend/planner && npm install && npx prisma generate --schema=prisma/schema.prod.prisma && npx prisma migrate deploy --schema=prisma/schema.prod.prisma && npm run build
    startCommand: cd backend/planner && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: planner-db
          property: connectionString

databases:
  - name: planner-db
    databaseName: planner
    user: planner
    plan: free
