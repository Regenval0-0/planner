# Render Blueprint: бесплатный сервер «Планера».
# База данных — бесплатный Neon (https://neon.tech): база Render на бесплатном тарифе
# удаляется через 30 дней, а Neon — бессрочно. Строку подключения Neon Render спросит
# при создании (переменная DATABASE_URL).
# Бесплатный сервер засыпает после 15 минут без запросов — его «будит» пинг
# (UptimeRobot или .github/workflows/keep-alive.yml), см. ЗАПУСК-И-RUSTORE.md.
services:
  - type: web
    name: planner-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend/planner
    buildCommand: npm ci --include=dev && npm run prod:generate && npm run build
    startCommand: npm run prod:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
