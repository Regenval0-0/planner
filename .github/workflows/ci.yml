name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/planner/package-lock.json
      - run: npm ci
      - name: Тесты API (SQLite)
        run: npm test
      - name: Сборка с PostgreSQL-клиентом
        run: npm run prod:generate && npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/planner/package-lock.json
      - run: npm ci
      - name: Тесты (повторы, офлайн-очередь)
        run: npm test
      - name: Проверка типов и сборка
        run: npm run build
