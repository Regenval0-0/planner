name: Не давать серверу засыпать

# Бесплатный сервер Render засыпает после 15 минут без запросов, и первый вход
# потом занимает до минуты. Этот пинг раз в 10 минут держит его включённым.
# Нужна переменная репозитория SERVER_URL (Settings → Secrets and variables → Actions → Variables),
# например https://planner-backend-xxxx.onrender.com
# Внимание: GitHub отключает расписания в репозиториях без коммитов 60 дней —
# надёжнее дополнительно настроить бесплатный UptimeRobot (см. ЗАПУСК-И-RUSTORE.md).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: vars.SERVER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.SERVER_URL }}/health"
