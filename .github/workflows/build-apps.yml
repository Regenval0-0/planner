name: Сборка приложений

# Запуск: вкладка Actions → «Сборка приложений» → Run workflow,
# или автоматически при теге v* (например v1.1.0).
#
# Нужно один раз настроить в Settings → Secrets and variables → Actions:
#   Variables: VITE_BACKEND_URL (https://адрес-сервера), VITE_SUPPORT_EMAIL
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
  VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/planner/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run check-env
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет ANDROID_KEYSTORE_BASE64 — релиз для RuStore должен быть подписан"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/planner-release.keystore
          cat > android/app/keystore.properties <<PROPS
          STORE_FILE=planner-release.keystore
          STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Сборка APK и AAB
        working-directory: frontend/planner/android
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: planner-android
          path: |
            frontend/planner/android/app/build/outputs/apk/release/app-release.apk
            frontend/planner/android/app/build/outputs/bundle/release/app-release.aab

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/planner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/planner/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: planner-windows
          path: frontend/planner/release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            planner-android/**/*.apk
            planner-android/**/*.aab
            planner-windows/*.exe
