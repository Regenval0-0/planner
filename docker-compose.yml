# Локальный запуск сервера с PostgreSQL на своём компьютере (для проверки).
# Перед запуском создайте файл .env рядом с этим файлом:
#   JWT_SECRET=<случайная строка от 32 символов>
#   POSTGRES_PASSWORD=<пароль базы>
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
      POSTGRES_DB: planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend/planner
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Укажите JWT_SECRET в .env}
      DATABASE_URL: postgresql://planner:${POSTGRES_PASSWORD}@db:5432/planner?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
